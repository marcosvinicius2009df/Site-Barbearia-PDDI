<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>JLukas Barber Shop - Loja Oficial</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="firebase-init.js"></script>
</head>
<body style="background-color: var(--bg-fundo); color: white;">
    
    <nav class="navbar">
        <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">JLukas Barber Shop</a></div>
        <div class="menu-toggle" id="mobile-menu">☰</div>
        <ul class="nav-links">
            <li><a href="index.html">Início</a></li>
            <li><a href="agendar.html">Agendar</a></li>
            <li><a href="perfil.html">Meu Perfil</a></li>
        </ul>
    </nav>

    <div class="cart-icon" role="button" tabindex="0" aria-label="Abrir carrinho">
        🛒 <span id="contagem-carrinho" class="cart-count">0</span>
    </div>

    <section class="secao-produtos" style="margin-top: 100px; text-align: center;">
        <h2 class="titulo-secao">Nossa Linha Exclusiva</h2>
        <p style="color: var(--texto-cinza); margin-bottom: 40px;">Produtos premium selecionados pelos nossos barbeiros.</p>
        
        <div id="vitrine-produtos" class="cards-container">
            <div style="width: 100%; text-align: center; color: var(--dourado); font-size: 1.2rem; padding: 50px;">
                A carregar o nosso catálogo... <i class="fa-solid fa-spinner fa-spin"></i>
            </div>
        </div>
    </section>

    <div id="modal-carrinho" aria-hidden="true" style="visibility: hidden; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; display: flex; justify-content: center; align-items: center;">
        <div class="form-box" style="background: #111; border: 1px solid var(--dourado); width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto;">
            <h2 style="color: var(--dourado); margin-bottom: 20px;">Meu Carrinho</h2>
            <div id="itens-carrinho"></div>
            <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
            <h3 id="total-carrinho" style="text-align: right; color: white; font-size: 1.5rem;">Total: R$ 0,00</h3>
            <button onclick="finalizarCompra()" class="btn-confirmar" style="margin-top: 20px; width: 100%; background: #25D366; color: white; font-size: 1.1rem; border-color: #25D366;">PEDIR VIA WHATSAPP</button>
            <button onclick="fecharCarrinho()" class="btn-horario" style="margin-top: 15px; width: 100%; background: transparent; color: var(--texto-cinza);">Voltar para a Loja</button>
        </div>
    </div>

    <script>
        const menuToggle = document.getElementById('mobile-menu');
        const navLinks = document.querySelector('.nav-links');
        if (menuToggle && navLinks) {
            menuToggle.addEventListener('click', () => navLinks.classList.toggle('active'));
            navLinks.querySelectorAll('a').forEach(link => link.addEventListener('click', () => navLinks.classList.remove('active')));
        }
        function avisoLoja(mensagem) {
            const toast = document.createElement('div'); toast.textContent = String(mensagem); toast.setAttribute('role','status');
            toast.style.cssText = 'position:fixed;bottom:20px;right:20px;max-width:90vw;background:#121212;color:var(--dourado);padding:15px 25px;border-radius:8px;border:1px solid var(--dourado);z-index:99999;';
            document.body.appendChild(toast); setTimeout(() => toast.remove(), 3000);
        }
        const vitrine = document.getElementById('vitrine-produtos');
        const modalCarrinho = document.getElementById('modal-carrinho');
        const numeroWhatsAppLoja = '5561999999999'; 
        let carrinho = [];
        try { const salvo = JSON.parse(localStorage.getItem('carrinhoJLukas') || '[]'); carrinho = Array.isArray(salvo) ? salvo.filter(x => x && typeof x.nome === 'string' && Number.isFinite(Number(x.preco)) && Number(x.preco) >= 0) : []; }
        catch { carrinho = []; localStorage.removeItem('carrinhoJLukas'); }
        function salvarCarrinho() { localStorage.setItem('carrinhoJLukas', JSON.stringify(carrinho)); }
        function atualizarIcone() { const contador = document.getElementById('contagem-carrinho'); if (contador) contador.textContent = String(carrinho.length); }
        function abrirCarrinho() { modalCarrinho.classList.add('ativo'); modalCarrinho.setAttribute('aria-hidden','false'); renderizarCarrinho(); }
        function fecharCarrinho() { modalCarrinho.classList.remove('ativo'); modalCarrinho.setAttribute('aria-hidden','true'); }
        window.abrirCarrinho = abrirCarrinho; window.fecharCarrinho = fecharCarrinho;
        function renderizarCarrinho() {
            const lista = document.getElementById('itens-carrinho'); lista.replaceChildren(); let total = 0;
            if (!carrinho.length) { const p = document.createElement('p'); p.textContent = 'O seu carrinho está vazio.'; lista.appendChild(p); }
            carrinho.forEach((item, index) => {
                const linha = document.createElement('div'); linha.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px;background:rgba(255,255,255,.05);padding:15px;border-radius:8px;';
                const nome = document.createElement('span'); nome.textContent = item.nome; nome.style.color = 'white';
                const grupo = document.createElement('div'); grupo.style.cssText = 'display:flex;align-items:center;gap:12px;';
                const preco = Number(item.preco); total += preco; const valor = document.createElement('span'); valor.textContent = `R$ ${preco.toFixed(2).replace('.', ',')}`; valor.style.color = 'var(--dourado)';
                const remover = document.createElement('button'); remover.type = 'button'; remover.textContent = 'Remover'; remover.setAttribute('aria-label', `Remover ${item.nome}`); remover.addEventListener('click', () => removerItem(index));
                grupo.append(valor, remover); linha.append(nome, grupo); lista.appendChild(linha);
            });
            document.getElementById('total-carrinho').textContent = `Total: R$ ${total.toFixed(2).replace('.', ',')}`;
        }
        function adicionarAoCarrinho(nome, preco) {
            const valor = Number(preco); if (!String(nome).trim() || !Number.isFinite(valor) || valor < 0) return avisoLoja('Produto inválido.');
            carrinho.push({ nome: String(nome).slice(0,100), preco: valor }); salvarCarrinho(); atualizarIcone(); avisoLoja('Produto adicionado ao carrinho.');
        }
        function removerItem(index) { carrinho.splice(index,1); salvarCarrinho(); atualizarIcone(); renderizarCarrinho(); }
        window.removerItem = removerItem;
        function finalizarCompra() {
            if (!carrinho.length) return avisoLoja('Adicione produtos antes de finalizar.');
            const total = carrinho.reduce((sum,item) => sum + Number(item.preco), 0);
            const linhas = carrinho.map(item => `• ${item.nome} — R$ ${Number(item.preco).toFixed(2).replace('.', ',')}`);
            const mensagem = `Olá, JLukas! Gostaria de solicitar estes produtos:\n\n${linhas.join('\n')}\n\nTotal estimado: R$ ${total.toFixed(2).replace('.', ',')}\n\nAguardo confirmação de disponibilidade e pagamento.`;
            const url = `https://wa.me/${numeroWhatsAppLoja}?text=${encodeURIComponent(mensagem)}`;
            const link = document.createElement('a'); link.href = url; link.target = '_blank'; link.rel = 'noopener noreferrer';
            document.body.appendChild(link); link.click(); link.remove();
        }
        window.finalizarCompra = finalizarCompra;
        const cartButton = document.querySelector('.cart-icon');
        cartButton?.addEventListener('click', abrirCarrinho);
        cartButton?.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); abrirCarrinho(); } });
        modalCarrinho?.addEventListener('click', event => { if (event.target === modalCarrinho) fecharCarrinho(); });
        document.addEventListener('keydown', event => { if (event.key === 'Escape') fecharCarrinho(); });
        database.ref('produtos').on('value', snapshot => {
            vitrine.replaceChildren();
            if (!snapshot.exists()) { const p = document.createElement('p'); p.textContent = 'Os nossos produtos estão sendo atualizados. Volte em breve!'; vitrine.appendChild(p); return; }
            snapshot.forEach(child => {
                const produto = child.val() || {}; const preco = Number(produto.preco);
                if (!String(produto.nome || '').trim() || !Number.isFinite(preco) || preco < 0) return;
                const card = document.createElement('article'); card.className = 'card-item'; card.style.cssText = 'display:flex;flex-direction:column;justify-content:space-between;height:100%;';
                const topo = document.createElement('div'); const img = document.createElement('img');
                try { const u = new URL(produto.imagem || '', location.origin); img.src = ['http:','https:'].includes(u.protocol) ? u.href : ''; } catch { img.src = ''; }
                img.alt = String(produto.nome); img.loading = 'lazy'; img.style.cssText = 'width:100%;height:250px;object-fit:cover;border-radius:8px;margin-bottom:15px;border:1px solid #333;';
                const nome = document.createElement('h3'); nome.textContent = String(produto.nome); nome.style.cssText = 'color:var(--branco);font-size:1.2rem;margin-bottom:10px;'; topo.append(img,nome);
                const baixo = document.createElement('div'); const valor = document.createElement('span'); valor.textContent = `R$ ${preco.toFixed(2).replace('.', ',')}`; valor.className = 'preco-tag'; valor.style.cssText = 'display:inline-block;margin-bottom:15px;font-size:1.4rem;';
                const botao = document.createElement('button'); botao.type = 'button'; botao.className = 'btn-confirmar'; botao.textContent = '🛒 ADICIONAR'; botao.style.width = '100%'; botao.addEventListener('click', () => adicionarAoCarrinho(produto.nome, preco));
                baixo.append(valor,botao); card.append(topo,baixo); vitrine.appendChild(card);
            });
        }, error => { console.error(error); vitrine.textContent = 'Não foi possível carregar os produtos.'; });
        atualizarIcone();
    </script>
</body>
</html>
