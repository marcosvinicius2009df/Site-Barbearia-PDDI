<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Loja — JLukas Barber Shop</title>
    <meta name="description" content="Produtos premium selecionados pelos barbeiros da JLukas. Monte seu pedido e finalize pelo WhatsApp.">
    <meta name="theme-color" content="#030303">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="firebase-init.js"></script>
</head>
<body style="background-color: var(--bg-fundo); color: white;">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    
    <nav class="navbar">
        <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">JLukas Barber Shop</a></div>
        <div class="menu-toggle" id="mobile-menu" role="button" tabindex="0" aria-label="Abrir menu" aria-expanded="false">☰</div>
        <ul class="nav-links">
            <li><a href="index.html">Início</a></li>
            <li><a href="agendar.html">Agendar</a></li>
            <li><a href="perfil.html">Meu Perfil</a></li>
        </ul>
    </nav>

    <div class="cart-icon" role="button" tabindex="0" aria-label="Abrir carrinho">
        🛒 <span id="contagem-carrinho" class="cart-count">0</span>
    </div>

    <section id="conteudo" class="secao-produtos" style="margin-top: 100px; text-align: center;">
        <h2 class="titulo-secao">Nossa Linha Exclusiva</h2>
        <p style="color: var(--texto-cinza); margin-bottom: 40px;">Produtos premium selecionados pelos nossos barbeiros.</p>
        
        <div id="vitrine-produtos" class="cards-container">
            <div style="width: 100%; text-align: center; color: var(--dourado); font-size: 1.2rem; padding: 50px;">
                A carregar o nosso catálogo... <i class="fa-solid fa-spinner fa-spin"></i>
            </div>
        </div>
    </section>

    <div id="modal-carrinho" aria-hidden="true" style="visibility: hidden; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; display: flex; justify-content: center; align-items: center;">
        <div class="form-box" style="background: #111; border: 1px solid var(--dourado); width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto;">
            <h2 style="color: var(--dourado); margin-bottom: 20px;">Meu Carrinho</h2>
            <div id="itens-carrinho"></div>
            <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
            <h3 id="total-carrinho" style="text-align: right; color: white; font-size: 1.5rem;">Total: R$ 0,00</h3>
            <button onclick="finalizarCompra()" class="btn-confirmar" style="margin-top: 20px; width: 100%; background: #25D366; color: white; font-size: 1.1rem; border-color: #25D366;">PEDIR VIA WHATSAPP</button>
            <button onclick="fecharCarrinho()" class="btn-horario" style="margin-top: 15px; width: 100%; background: transparent; color: var(--texto-cinza);">Voltar para a Loja</button>
        </div>
    </div>

    <script>
        const menuToggle = document.getElementById('mobile-menu');
        const navLinks = document.querySelector('.nav-links');
        if (menuToggle && navLinks) {
            menuToggle.addEventListener('click', () => { const a = navLinks.classList.toggle('active'); menuToggle.setAttribute('aria-expanded', String(a)); });
            menuToggle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); menuToggle.click(); } });
            navLinks.querySelectorAll('a').forEach(link => link.addEventListener('click', () => navLinks.classList.remove('active')));
        }
        function avisoLoja(mensagem) {
            const toast = document.createElement('div'); toast.textContent = String(mensagem); toast.setAttribute('role','status');
            toast.style.cssText = 'position:fixed;bottom:20px;right:20px;max-width:90vw;background:#121212;color:var(--dourado);padding:15px 25px;border-radius:8px;border:1px solid var(--dourado);z-index:99999;';
            document.body.appendChild(toast); setTimeout(() => toast.remove(), 3000);
        }
        const vitrine = document.getElementById('vitrine-produtos');
        const modalCarrinho = document.getElementById('modal-carrinho');
        const numeroWhatsAppLoja = WHATSAPP_OFICIAL;
        let carrinho = [];
        const MAX_QTD = 20;
        const reais = v => `R$ ${Number(v).toFixed(2).replace('.', ',')}`;
        try {
            const salvo = JSON.parse(localStorage.getItem('carrinhoJLukas') || '[]');
            carrinho = Array.isArray(salvo) ? salvo.filter(x => x && typeof x.nome === 'string' && Number.isFinite(Number(x.preco)) && Number(x.preco) >= 0)
                .map(x => ({ nome: x.nome.slice(0, 100), preco: Number(x.preco), qtd: Math.min(MAX_QTD, Math.max(1, parseInt(x.qtd, 10) || 1)) })) : [];
        } catch { carrinho = []; try { localStorage.removeItem('carrinhoJLukas'); } catch {} }
        function salvarCarrinho() { try { localStorage.setItem('carrinhoJLukas', JSON.stringify(carrinho)); } catch {} }
        function atualizarIcone() { const c = document.getElementById('contagem-carrinho'); if (c) c.textContent = String(carrinho.reduce((t, i) => t + i.qtd, 0)); }
        function abrirCarrinho() { modalCarrinho.classList.add('ativo'); modalCarrinho.setAttribute('aria-hidden', 'false'); renderizarCarrinho(); }
        function fecharCarrinho() { modalCarrinho.classList.remove('ativo'); modalCarrinho.setAttribute('aria-hidden', 'true'); }
        window.abrirCarrinho = abrirCarrinho; window.fecharCarrinho = fecharCarrinho;
        function alterarQtd(index, delta) {
            const item = carrinho[index]; if (!item) return;
            item.qtd += delta; if (item.qtd <= 0) carrinho.splice(index, 1); else item.qtd = Math.min(item.qtd, MAX_QTD);
            salvarCarrinho(); atualizarIcone(); renderizarCarrinho();
        }
        function renderizarCarrinho() {
            const lista = document.getElementById('itens-carrinho'); lista.replaceChildren(); let total = 0;
            if (!carrinho.length) { const p = document.createElement('p'); p.textContent = 'O seu carrinho está vazio.'; lista.appendChild(p); }
            carrinho.forEach((item, index) => {
                total += item.preco * item.qtd;
                const linha = document.createElement('div'); linha.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px;background:rgba(255,255,255,.05);padding:15px;border-radius:8px;flex-wrap:wrap;';
                const info = document.createElement('div'); const nome = document.createElement('span'); nome.textContent = item.nome; nome.style.cssText = 'color:white;display:block;';
                const unit = document.createElement('small'); unit.textContent = reais(item.preco) + ' cada'; unit.style.color = 'var(--texto-cinza)'; info.append(nome, unit);
                const ctrl = document.createElement('div'); ctrl.className = 'qtd-ctrl';
                const menos = document.createElement('button'); menos.type = 'button'; menos.textContent = '−'; menos.setAttribute('aria-label', `Diminuir ${item.nome}`); menos.addEventListener('click', () => alterarQtd(index, -1));
                const qtd = document.createElement('span'); qtd.textContent = String(item.qtd); qtd.style.cssText = 'color:white;min-width:20px;text-align:center;'; qtd.setAttribute('aria-live', 'polite');
                const mais = document.createElement('button'); mais.type = 'button'; mais.textContent = '+'; mais.setAttribute('aria-label', `Aumentar ${item.nome}`); mais.addEventListener('click', () => alterarQtd(index, 1));
                const sub = document.createElement('span'); sub.textContent = reais(item.preco * item.qtd); sub.style.cssText = 'color:var(--dourado);min-width:80px;text-align:right;';
                const remover = document.createElement('button'); remover.type = 'button'; remover.className = 'item-remover'; remover.textContent = 'Remover'; remover.setAttribute('aria-label', `Remover ${item.nome}`); remover.addEventListener('click', () => alterarQtd(index, -item.qtd));
                ctrl.append(menos, qtd, mais, sub, remover); linha.append(info, ctrl); lista.appendChild(linha);
            });
            document.getElementById('total-carrinho').textContent = `Total: ${reais(total)}`;
        }
        function adicionarAoCarrinho(nome, preco) {
            const valor = Number(preco); const n = String(nome).trim().slice(0, 100);
            if (!n || !Number.isFinite(valor) || valor < 0) return avisoLoja('Produto inválido.');
            const existente = carrinho.find(i => i.nome === n && i.preco === valor);
            if (existente) { if (existente.qtd >= MAX_QTD) return avisoLoja(`Limite de ${MAX_QTD} unidades por produto.`); existente.qtd++; }
            else carrinho.push({ nome: n, preco: valor, qtd: 1 });
            salvarCarrinho(); atualizarIcone(); avisoLoja('Produto adicionado ao carrinho.');
        }
        function finalizarCompra() {
            if (!carrinho.length) return avisoLoja('Adicione produtos antes de finalizar.');
            const total = carrinho.reduce((t, i) => t + i.preco * i.qtd, 0);
            const linhas = carrinho.map(i => `• ${i.qtd}x ${i.nome} — ${reais(i.preco * i.qtd)}`);
            const mensagem = `Olá, JLukas! Gostaria de solicitar estes produtos:\n\n${linhas.join('\n')}\n\nTotal estimado: ${reais(total)}\n\nAguardo confirmação de disponibilidade e pagamento.`;
            const url = `https://wa.me/${numeroWhatsAppLoja}?text=${encodeURIComponent(mensagem)}`;
            const link = document.createElement('a'); link.href = url; link.target = '_blank'; link.rel = 'noopener noreferrer';
            document.body.appendChild(link); link.click(); link.remove();
        }
        window.finalizarCompra = finalizarCompra;
        const cartButton = document.querySelector('.cart-icon');
        cartButton?.addEventListener('click', abrirCarrinho);
        cartButton?.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); abrirCarrinho(); } });
        modalCarrinho?.addEventListener('click', event => { if (event.target === modalCarrinho) fecharCarrinho(); });
        document.addEventListener('keydown', event => { if (event.key === 'Escape') fecharCarrinho(); });
        database.ref('produtos').on('value', snapshot => {
            vitrine.replaceChildren();
            if (!snapshot.exists()) { const p = document.createElement('p'); p.textContent = 'Os nossos produtos estão sendo atualizados. Volte em breve!'; vitrine.appendChild(p); return; }
            snapshot.forEach(child => {
                const produto = child.val() || {}; const preco = Number(produto.preco);
                if (!String(produto.nome || '').trim() || !Number.isFinite(preco) || preco < 0) return;
                const card = document.createElement('article'); card.className = 'card-item'; card.style.cssText = 'display:flex;flex-direction:column;justify-content:space-between;height:100%;';
                const topo = document.createElement('div'); const img = document.createElement('img');
                const fallbackProduto = 'https://images.unsplash.com/photo-1599305090598-fe179d501227?q=80&w=400&auto=format&fit=crop';
                try { const u = new URL(produto.imagem || fallbackProduto, location.origin); img.src = ['http:','https:'].includes(u.protocol) ? u.href : fallbackProduto; } catch { img.src = fallbackProduto; }
                img.alt = String(produto.nome); img.loading = 'lazy'; img.style.cssText = 'width:100%;height:250px;object-fit:cover;border-radius:8px;margin-bottom:15px;border:1px solid #333;';
                const nome = document.createElement('h3'); nome.textContent = String(produto.nome); nome.style.cssText = 'color:var(--branco);font-size:1.2rem;margin-bottom:10px;'; topo.append(img,nome);
                const baixo = document.createElement('div'); const valor = document.createElement('span'); valor.textContent = `R$ ${preco.toFixed(2).replace('.', ',')}`; valor.className = 'preco-tag'; valor.style.cssText = 'display:inline-block;margin-bottom:15px;font-size:1.4rem;';
                const botao = document.createElement('button'); botao.type = 'button'; botao.className = 'btn-confirmar'; botao.textContent = '🛒 ADICIONAR'; botao.style.width = '100%'; botao.addEventListener('click', () => adicionarAoCarrinho(produto.nome, preco));
                baixo.append(valor,botao); card.append(topo,baixo); vitrine.appendChild(card);
            });
        }, error => { console.error(error); vitrine.textContent = 'Não foi possível carregar os produtos.'; });
        atualizarIcone();
    </script>
</body>
</html>
